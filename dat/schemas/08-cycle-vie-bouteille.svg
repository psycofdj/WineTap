<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="24" font-weight="700" fill="#1A1A1A">Cycle de vie d'une bouteille et de son tag</text>
  <text x="30" y="64" font-size="14" fill="#555">La consommation garde la bouteille dans l'historique et libère son tag ; la suppression est définitive</text>

  <!-- Bouteille -->
  <text x="30" y="108" font-size="15" font-weight="700" fill="#005A9E">Bouteille (table bottles)</text>
  <g font-size="13" fill="#1A1A1A">
    <rect x="30" y="160" width="200" height="60" rx="30" fill="#FFFFFF" stroke="#78909C" stroke-width="1.8"/>
    <text x="130" y="186" text-anchor="middle" font-weight="700">Entrée en cave</text>
    <text x="130" y="205" text-anchor="middle" font-size="11.5" fill="#555">depuis le site</text>

    <rect x="330" y="135" width="330" height="110" rx="12" fill="#EEF5FC" stroke="#0078D4" stroke-width="2.2"/>
    <text x="495" y="165" text-anchor="middle" font-size="16" font-weight="700">En stock</text>
    <text x="350" y="192">consumed_at : vide</text>
    <text x="350" y="212">tag_id : UID du tag (ou vide)</text>
    <text x="350" y="232" font-size="11.5" fill="#555">Modifiable par PUT /api/bouteilles/&lt;id&gt;</text>

    <rect x="920" y="135" width="330" height="110" rx="12" fill="#F5F5F5" stroke="#78909C" stroke-width="2.2"/>
    <text x="1085" y="165" text-anchor="middle" font-size="16" font-weight="700">Consommée</text>
    <text x="940" y="192">consumed_at : date UTC</text>
    <text x="940" y="212">tag_id : vide</text>
    <text x="940" y="232" font-size="11.5" fill="#555">Historique des dégustations, commentaire</text>

    <rect x="640" y="300" width="300" height="60" rx="12" fill="#FDECEC" stroke="#C62828" stroke-width="2"/>
    <text x="790" y="326" text-anchor="middle" font-size="16" font-weight="700">Supprimée</text>
    <text x="790" y="346" text-anchor="middle" font-size="11.5" fill="#555">Plus aucune trace dans la base</text>
  </g>
  <line x1="230" y1="190" x2="326" y2="190" stroke="#0078D4" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="278" y="180" font-size="11.5" fill="#555" text-anchor="middle">POST /api/</text>
  <text x="278" y="210" font-size="11.5" fill="#555" text-anchor="middle">bouteilles</text>

  <line x1="660" y1="190" x2="916" y2="190" stroke="#0078D4" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="788" y="160" font-size="12.5" font-weight="700" fill="#005A9E" text-anchor="middle">Consommation</text>
  <text x="788" y="178" font-size="11.5" fill="#555" text-anchor="middle">application : POST /api/consommer (tag)</text>
  <text x="788" y="210" font-size="11.5" fill="#555" text-anchor="middle">bouton : POST …/&lt;id&gt;/consommer</text>
  <text x="788" y="226" font-size="11.5" fill="#C62828" text-anchor="middle">aucun retour en stock</text>

  <path d="M495 245 V330 H636" stroke="#C62828" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M1085 245 V330 H944" stroke="#C62828" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="510" y="290" font-size="11.5" fill="#C62828">DELETE /api/bouteilles/&lt;id&gt;</text>
  <text x="1100" y="290" font-size="11.5" fill="#C62828">DELETE /api/bouteilles/&lt;id&gt;</text>

  <!-- Tag -->
  <line x1="30" y1="400" x2="1370" y2="400" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="30" y="436" font-size="15" font-weight="700" fill="#1B5E20">Tag NFC (seul son UID est lu ; rien n'est écrit)</text>
  <g font-size="13" fill="#1A1A1A">
    <rect x="330" y="470" width="330" height="70" rx="12" fill="#F1F8F1" stroke="#2E7D32" stroke-width="2.2"/>
    <text x="495" y="500" text-anchor="middle" font-size="15" font-weight="700">Porté par une bouteille en stock</text>
    <text x="495" y="522" text-anchor="middle" font-size="11.5" fill="#555">Unique : une seule bouteille à la fois</text>
    <rect x="920" y="470" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.2"/>
    <text x="1085" y="500" text-anchor="middle" font-size="15" font-weight="700">Libre</text>
    <text x="1085" y="522" text-anchor="middle" font-size="11.5" fill="#555">Réutilisable pour une autre bouteille</text>
  </g>
  <line x1="660" y1="490" x2="916" y2="490" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#av)"/>
  <text x="788" y="480" font-size="11.5" fill="#555" text-anchor="middle">libéré à la consommation</text>
  <line x1="920" y1="522" x2="664" y2="522" stroke="#2E7D32" stroke-width="2.4" marker-end="url(#av)"/>
  <text x="788" y="545" font-size="11.5" fill="#555" text-anchor="middle">associé à une nouvelle entrée en stock</text>
</svg>
