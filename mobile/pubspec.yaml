name: wine_tap_mobile
description: "WineTap — cave à vin : site embarqué, serveur local et lecteur NFC."
publish_to: 'none'
version: 0.0.0+dev

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  nfc_manager: ^4.2.0
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  shared_preferences: ^2.0.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  sqlite3: ^3.2.0
  path_provider: ^2.1.0
  wakelock_plus: ^1.4.0
  package_info_plus: ^9.0.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  crypto: ^3.0.7
  flutter_svg: ^2.3.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.32.0
  fake_async: ^1.3.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # Site embarqué : construit depuis web/ par scripts/build_web.sh (non versionné).
  assets:
    - assets/site/
    - assets/site/assets/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
